<!DOCTYPE html>
<html>
  <head>
    <title>Native 3D AR Office</title>
    
    <!-- PWA Install Config -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      /* Clean background styling */
      body {
        margin: 0px;
        overflow: hidden;
      }
    </style>

    <script>
      // ==========================================
      // PWA SERVICE WORKER REGISTRATION
      // ==========================================
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { 
          navigator.serviceWorker.register('./sw.js'); 
        });
      }

      // ==========================================
      // FETCH DATA FROM GOOGLE SHEETS
      // ==========================================
      const scriptURL = 'https://script.google.com/macros/s/AKfycbzEpfF8pJVOPFhJF0DJIIojictD5N9KpmmRjx7tN_0AphPqMyLhAvNxfX62zQFsygup2g/exec';

      window.onload = function() {
        fetch(scriptURL)
          .then(response => response.json())
          .then(data => {
            document.querySelector('#board-data').setAttribute('value', data.Whiteboard || "No tasks written yet.");
            document.querySelector('#note1-data').setAttribute('value', data.Note1 || "...");
            document.querySelector('#note2-data').setAttribute('value', data.Note2 || "...");
            document.querySelector('#note3-data').setAttribute('value', data.Note3 || "...");
          })
          .catch(error => console.error("Error loading data:", error));

        // Audio feedback on scan
        const hiroMarker = document.querySelector('#hiro-marker');
        const kanjiMarker = document.querySelector('#kanji-marker');
        const scanSound = document.querySelector('#scan-sound');

        hiroMarker.addEventListener('markerFound', () => scanSound.components.sound.playSound());
        kanjiMarker.addEventListener('markerFound', () => scanSound.components.sound.playSound());
      };

      // ==========================================
      // INTERACTIVE STICKY NOTES (3D Taps)
      // ==========================================
      AFRAME.registerComponent('mark-done', {
        init: function () {
          let isDone = false;
          let originalColor = this.el.getAttribute('color');
          
          this.el.addEventListener('click', function () {
            if (!isDone) {
              // Mark as complete (turn green)
              this.setAttribute('color', '#d4edda'); 
              this.querySelector('a-text').setAttribute('value', 'DONE ✓');
              this.querySelector('a-text').setAttribute('color', '#155724');
              isDone = true;
            } else {
              // Revert back to original note
              this.setAttribute('color', originalColor);
              this.querySelector('a-text').setAttribute('value', 'Reset'); 
              this.querySelector('a-text').setAttribute('color', '#000000');
              isDone = false;
            }
          });
        }
      });
    </script>
  </head>

  <body>

    <!-- AR Scene with high-res camera feed, raycaster for clicking, and lighting -->
    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth: 1280; sourceHeight: 720; displayWidth: 1280; displayHeight: 720;" 
             cursor="rayOrigin: mouse; fuse: false" 
             raycaster="objects: .clickable"
             vr-mode-ui="enabled: false">
             
      <a-assets>
        <audio id="chime" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=success-1-6297.mp3" preload="auto"></audio>
      </a-assets>
      <a-entity id="scan-sound" sound="src: #chime; volume: 1"></a-entity>

      <!-- ========================================== -->
      <!-- FRONT WALL: NATIVE WHITEBOARD (Hiro)       -->
      <!-- ========================================== -->
      <a-marker id="hiro-marker" preset="hiro" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        
        <!-- Scaled down so it fits nicely on screen -->
        <a-entity scale="0.65 0.65 0.65" position="0 0.5 0" rotation="-90 0 0">
          
          <!-- Aluminum Frame Base -->
          <a-plane width="4.2" height="3.2" color="#cccccc" position="0 0 0"></a-plane>
          
          <!-- White Dry-Erase Surface -->
          <a-plane width="4" height="3" color="#ffffff" position="0 0 0.02">
            
            <!-- Title -->
            <a-text value="PROJECT WHITEBOARD" color="#555555" position="-1.8 1.2 0.01" width="4" font="roboto"></a-text>
            <!-- Blue divider line -->
            <a-plane width="3.6" height="0.02" color="#007bff" position="0 1.05 0.01"></a-plane>
            
            <!-- Data Text (Anchored top-left, wrapping enabled) -->
            <a-text id="board-data" value="Loading..." color="#000000" position="-1.8 0.9 0.01" width="3.6" wrap-count="35" anchor="left" baseline="top" line-height="55" font="roboto"></a-text>
            
          </a-plane>

        </a-entity>
      </a-marker>

      <!-- ========================================== -->
      <!-- LEFT WALL: ORGANIC STICKY NOTES (Kanji)    -->
      <!-- ========================================== -->
      <a-marker id="kanji-marker" preset="kanji" smooth="true" smoothCount="10" smoothTolerance="0.01" smoothThreshold="5">
        
        <a-entity scale="0.8 0.8 0.8" position="0 0.5 0" rotation="-90 0 0">
          
          <!-- Sticky Note 1 (Yellow - Tilted slightly left) -->
          <a-plane class="clickable" mark-done position="-1.4 0 0" rotation="0 0 3" width="1.2" height="1.2" color="#FDFFB6">
            <a-plane width="1.2" height="1.2" color="#000000" material="opacity: 0.1" position="0.05 -0.05 -0.01"></a-plane>
            <a-text id="note1-data" value="..." color="#000000" align="center" position="0 0 0.02" width="2.5" wrap-count="12"></a-text>
          </a-plane>

          <!-- Sticky Note 2 (Pink - Tilted slightly right) -->
          <a-plane class="clickable" mark-done position="0 0 0" rotation="0 0 -2" width="1.2" height="1.2" color="#FFADAD">
            <a-plane width="1.2" height="1.2" color="#000000" material="opacity: 0.1" position="0.05 -0.05 -0.01"></a-plane>
            <a-text id="note2-data" value="..." color="#000000" align="center" position="0 0 0.02" width="2.5" wrap-count="12"></a-text>
          </a-plane>

          <!-- Sticky Note 3 (Blue - Straight) -->
          <a-plane class="clickable" mark-done position="1.4 0 0" rotation="0 0 1" width="1.2" height="1.2" color="#A0C4FF">
            <a-plane width="1.2" height="1.2" color="#000000" material="opacity: 0.1" position="0.05 -0.05 -0.01"></a-plane>
            <a-text id="note3-data" value="..." color="#000000" align="center" position="0 0 0.02" width="2.5" wrap-count="12"></a-text>
          </a-plane>

        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
