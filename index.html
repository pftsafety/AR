<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>AR Project Workspace</title>

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0f172a">

<link rel="manifest" href="manifest.json">

<script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
<script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}

#topBar{
position:fixed;top:10px;left:10px;right:10px;height:50px;z-index:9999;
display:flex;align-items:center;justify-content:space-between;padding:7px 12px;
color:#fff;background:rgba(15,23,42,.90);border:1px solid rgba(255,255,255,.15);
border-radius:12px;backdrop-filter:blur(10px);pointer-events:none
}

.brand{display:flex;align-items:center;gap:9px}
.brandIcon{
width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;
font-size:12px;font-weight:700;background:linear-gradient(135deg,#2563eb,#06b6d4)
}
.brandTitle{font-size:12px;font-weight:700;letter-spacing:.3px}
.brandSub{font-size:8px;opacity:.55;margin-top:2px}

.online{
display:flex;align-items:center;gap:5px;font-size:8px;font-weight:700;color:#86efac
}
.onlineDot{
width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 7px #22c55e
}

#message{
position:fixed;left:50%;bottom:14px;transform:translateX(-50%);
width:calc(100% - 30px);max-width:400px;z-index:9999;padding:10px 13px;
text-align:center;color:#fff;font-size:10px;font-weight:600;
background:rgba(15,23,42,.88);border:1px solid rgba(255,255,255,.12);
border-radius:11px;backdrop-filter:blur(10px);pointer-events:none
}

#message.active{background:rgba(21,128,61,.90)}

#loading{
position:fixed;inset:0;z-index:10001;display:flex;flex-direction:column;
align-items:center;justify-content:center;background:#0f172a;color:#fff;
transition:opacity .3s ease
}

.spinner{
width:36px;height:36px;border:3px solid rgba(255,255,255,.15);
border-top-color:#38bdf8;border-radius:50%;animation:spin .8s linear infinite;margin-bottom:14px
}

@keyframes spin{to{transform:rotate(360deg)}}

.loadingTitle{font-size:14px;font-weight:700}
.loadingSub{font-size:10px;opacity:.55;margin-top:5px}
</style>

<script>

const scriptURL='https://script.google.com/macros/s/AKfycbzEpfF8pJVOPFhJF0DJIIojictD5N9KpmmRjx7tN_0AphPqMyLhAvNxfX62zQFsygup2g/exec';

if('serviceWorker' in navigator){
window.addEventListener('load',()=>{
navigator.serviceWorker.register('./sw.js').catch(e=>console.log('SW:',e));
});
}

AFRAME.registerComponent('mark-done',{
init:function(){

let completed=false;
const originalColor=this.el.getAttribute('color');
const text=this.el.querySelector('.taskText');
const status=this.el.querySelector('.taskStatus');

this.el.addEventListener('click',()=>{

completed=!completed;

if(completed){

this.el.setAttribute('color','#dcfce7');

if(text)text.setAttribute('color','#166534');

if(status){
status.setAttribute('value','✓ DONE');
status.setAttribute('color','#15803d');
}

}else{

this.el.setAttribute('color',originalColor);

if(text)text.setAttribute('color','#1e293b');

if(status){
status.setAttribute('value','OPEN');
status.setAttribute('color','#64748b');
}

}

});

}
});

window.addEventListener('load',()=>{

const loading=document.getElementById('loading');

setTimeout(()=>{
loading.style.opacity='0';
setTimeout(()=>loading.style.display='none',350);
},900);

fetch(scriptURL)
.then(r=>{
if(!r.ok)throw new Error('Server error');
return r.json();
})
.then(data=>{

console.log('AR DATA:',data);

const board=document.getElementById('board-data');
const n1=document.getElementById('note1-data');
const n2=document.getElementById('note2-data');
const n3=document.getElementById('note3-data');

if(board)board.setAttribute('value',data.Whiteboard||'No active project information');

if(n1)n1.setAttribute('value',data.Note1||'No task available');

if(n2)n2.setAttribute('value',data.Note2||'No task available');

if(n3)n3.setAttribute('value',data.Note3||'No task available');

})
.catch(error=>{

console.error(error);

document.getElementById('board-data').setAttribute(
'value','Project information unavailable'
);

document.getElementById('note1-data').setAttribute(
'value','Task data unavailable'
);

document.getElementById('note2-data').setAttribute(
'value','Task data unavailable'
);

document.getElementById('note3-data').setAttribute(
'value','Task data unavailable'
);

});

const hiro=document.getElementById('hiro-marker');
const kanji=document.getElementById('kanji-marker');
const message=document.getElementById('message');

hiro.addEventListener('markerFound',()=>{
message.innerText='✓ EXECUTIVE PROJECT BOARD DETECTED';
message.classList.add('active');
});

hiro.addEventListener('markerLost',()=>{
message.innerText='SCAN HIRO MARKER FOR PROJECT SUMMARY';
message.classList.remove('active');
});

kanji.addEventListener('markerFound',()=>{
message.innerText='✓ ACTIVE TASK BOARD DETECTED';
message.classList.add('active');
});

kanji.addEventListener('markerLost',()=>{
message.innerText='SCAN KANJI MARKER FOR ACTIVE TASKS';
message.classList.remove('active');
});

});

</script>
</head>

<body>

<div id="loading">
<div class="spinner"></div>
<div class="loadingTitle">Initializing AR Workspace</div>
<div class="loadingSub">Preparing camera and project data</div>
</div>

<div id="topBar">
<div class="brand">
<div class="brandIcon">AR</div>
<div>
<div class="brandTitle">PROJECT AR WORKSPACE</div>
<div class="brandSub">REAL-TIME PROJECT VISUALIZATION</div>
</div>
</div>
<div class="online"><span class="onlineDot"></span>ONLINE</div>
</div>

<div id="message">SCAN A MARKER TO VIEW PROJECT INFORMATION</div>

<a-scene

renderer="antialias:true;alpha:true;"
arjs="sourceType:webcam;debugUIEnabled:false;sourceWidth:640;sourceHeight:480;displayWidth:640;displayHeight:480;"
vr-mode-ui="enabled:false"
cursor="rayOrigin:mouse;fuse:false"
raycaster="objects:.clickable">

<a-plane width="3.43" height=".58" color="#f8fafc" position="0 1.625 .04"></a-plane>

value="PROJECT"
color="#2563eb"
position="-1.42 1.58 .06"
width="2.4"
font="roboto"
fontWeight="bold">
</a-text>

<a-text
value="EXECUTIVE SUMMARY"
color="#0f172a"
position="-1.42 1.39 .06"
width="3"
font="roboto"
fontWeight="bold">
</a-text>

<a-plane width=".92" height=".26" color="#dcfce7" position="1.03 1.52 .06"></a-plane>

<a-text
value="● LIVE"
color="#15803d"
align="center"
position="1.03 1.50 .07"
width=".9"
font="roboto"
fontWeight="bold">
</a-text>

<a-plane
width="3.02"
height="2.55"
color="#f8fafc"
position="0 .03 .04">
</a-plane>

<a-text
id="board-data"
value="Loading project information..."
color="#1e293b"
position="-1.35 1.12 .07"
width="2.75"
wrap-count="34"
anchor="left"
baseline="top"
line-height="36"
font="roboto">
</a-text>

<a-plane
width="3.02"
height=".015"
color="#cbd5e1"
position="0 -1.28 .06">
</a-plane>

<a-text
value="HLL • PROJECT MANAGEMENT"
color="#64748b"
align="center"
position="0 -1.52 .07"
width="2.3"
font="roboto">
</a-text>

</a-plane>

</a-entity>

</a-marker>

<a-marker
id="kanji-marker"
preset="kanji"
smooth="true"
smoothCount="10"
smoothTolerance="0.01"
smoothThreshold="5">

<a-entity position="0 0 .12" scale=".45 .45 .45">

<a-plane width="3.65" height="4.25" color="#0f172a" position="0 0 0"></a-plane>

<a-text
value="ACTIVE TASK BOARD"
color="#fff"
align="center"
position="0 1.82 .05"
width="3.1"
font="roboto"
fontWeight="bold">
</a-text>

<a-text
value="TAP TASK TO UPDATE"
color="#94a3b8"
align="center"
position="0 1.59 .05"
width="2.5"
font="roboto">
</a-text>


<a-plane
class="clickable"
mark-done
width="3.05"
height=".82"
color="#fef3c7"
position="0 1.00 .06">

<a-plane
width=".10"
height=".82"
color="#f59e0b"
position="-1.475 0 .03">
</a-plane>

<a-text
value="TASK 01"
color="#92400e"
position="-1.28 .23 .04"
width=".9"
font="roboto"
fontWeight="bold">
</a-text>

<a-text
id="note1-data"
class="taskText"
value="Loading..."
color="#1e293b"
position="-1.28 -.05 .04"
width="2.25"
wrap-count="27"

baseline="center"
font="roboto">

<a-text
class="taskStatus"
value="OPEN"
color="#64748b"
align="center"
position="1.05 .23 .04"
width=".7"
font="roboto"
fontWeight="bold">
</a-text>

</a-plane>


<a-plane
class="clickable"
mark-done
width="3.05"
height=".82"
color="#fce7f3"
position="0 0 .06">

<a-plane
width=".10"
height=".82"
color="#ec4899"
position="-1.475 0 .03">
</a-plane>

<a-text
value="TASK 02"
color="#9d174d"
position="-1.28 .23 .04"
width=".9"
font="roboto"
fontWeight="bold">
</a-text>

<a-text
id="note2-data"
class="taskText"
value="Loading..."
color="#1e293b"
position="-1.28 -.05 .04"
width="2.25"
wrap-count="27"
anchor="left"
baseline="center"
font="roboto">
</a-text>

<a-text
class="taskStatus"
value="OPEN"
color="#64748b"

width=".7"

fontWeight="bold">

</a-plane>


<a-plane
class="clickable"
mark-done
width="3.05"
height=".82"
color="#e0f2fe"
position="0 -1.00 .06">

<a-plane
width=".10"
height=".82"
color="#0284c7"
position="-1.475 0 .03">
</a-plane>

<a-text
value="TASK 03"
color="#075985"
position="-1.28 .23 .04"
width=".9"
font="roboto"
fontWeight="bold">
</a-text>

<a-text
id="note3-data"
class="taskText"
value="Loading..."
color="#1e293b"
position="-1.28 -.05 .04"
width="2.25"
wrap-count="27"
anchor="left"
baseline="center"
font="roboto">
</a-text>

<a-text
class="taskStatus"
value="OPEN"
color="#64748b"
align="center"
position="1.05 .23 .04"
width=".7"
font="roboto"

<a-text

<a-entity camera></a-entity>

</a-scene>

</body>
</html>
