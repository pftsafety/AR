<!DOCTYPE html>
<html>
  <head>
    <title>Professional AR Workspace</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#ffffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
      body { margin: 0px; overflow: hidden; }
    </style>

    <script>
      // Background PWA Worker
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
      }

      // Fetch Data from Google Sheets
      const scriptURL = 'https://script.google.com/macros/s/AKfycbzEpfF8pJVOPFhJF0DJIIojictD5N9KpmmRjx7tN_0AphPqMyLhAvNxfX62zQFsygup2g/exec';

      window.onload = function() {
        fetch(scriptURL)
          .then(response => response.json())
          .then(data => {
            document.querySelector('#board-data').setAttribute('value', data.Whiteboard || "No active tasks.");
            document.querySelector('#note1-data').setAttribute('value', data.Note1 || "...");
            document.querySelector('#note2-data').setAttribute('value', data.Note2 || "...");
            document.querySelector('#note3-data').setAttribute('value', data.Note3 || "...");
          })
          .catch(error => console.error("Error loading data:", error));

        // Audio feedback on scan
        const hiroMarker = document.querySelector('#hiro-marker');
        const kanjiMarker = document.querySelector('#kanji-marker');
        const scanSound = document.querySelector('#scan-sound');

        hiroMarker.addEventListener('markerFound', () => scanSound.components.sound.playSound());
        kanjiMarker.addEventListener('markerFound', () => scanSound.components.sound.playSound());
      };

      // Interactive Sticky Notes Component
      AFRAME.registerComponent('mark-done', {
        init: function () {
          let isDone = false;
          let originalColor = this.el.getAttribute('color');
          
          this.el.addEventListener('click', function () {
            if (!isDone) {
              this.setAttribute('color', '#e2f0d9'); // Soft professional success green
              this.querySelector('a-text').setAttribute('value', 'COMPLETED');
              this.querySelector('a-text').setAttribute('color', '#274e13');
              isDone = true;
            } else {
              this.setAttribute('color', originalColor);
              this.querySelector('a-text').setAttribute('value', 'Reset'); 
              this.querySelector('a-text').setAttribute('color', '#333333');
              isDone = false;
            }
          });
        }
      });
    </script>
  </head>

  <body>

    <!-- Optimized AR Scene for speed and stability -->
    <a-scene embedded 
             arjs="sourceType: webcam; debugUIEnabled: false; sourceWidth: 640; sourceHeight: 480; displayWidth: 640; displayHeight: 480;" 
             cursor="rayOrigin: mouse; fuse: false" 
             raycaster="objects: .clickable"
             vr-mode-ui="enabled: false">
             
      <a-assets>
        <audio id="chime" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=success-1-6297.mp3" preload="auto"></audio>
      </a-assets>
      <a-entity id="scan-sound" sound="src: #chime; volume: 1"></a-entity>

      <!-- ========================================== -->
      <!-- EXECUTIVE WHITEBOARD (Hiro Marker)         -->
      <!-- ========================================== -->
      <a-marker id="hiro-marker" preset="hiro" smooth="true" smoothCount="15" smoothTolerance="0.01" smoothThreshold="5">
        
        <a-entity scale="0.65 0.65 0.65" position="0 0 0.2">
          
          <!-- Sleek Dark Slate Executive Frame -->
          <a-plane width="4.2" height="3.2" color="#2c3e50" position="0 0 0"></a-plane>
          
          <!-- Clean Matte White Board Surface -->
          <a-plane width="4" height="3" color="#fcfcfc" position="0 0 0.02">
            
            <!-- Professional Header -->
            <a-text value="PROJECT EXECUTIVE SUMMARY" color="#1a252f" position="-1.8 1.25 0.01" width="3.8" font="roboto" fontWeight="bold"></a-text>
            
            <!-- Corporate Blue Accent Line -->
            <a-plane width="3.6" height="0.015" color="#2980b9" position="0 1.12 0.01"></a-plane>
            
            <!-- Body Text: wrap-count="48" forces smaller, professional text sizing -->
            <a-text id="board-data" value="Loading data..." color="#34495e" position="-1.8 0.95 0.01" width="3.6" wrap-count="48" anchor="left" baseline="top" line-height="45" font="roboto"></a-text>
          
          </a-plane>
        </a-entity>
      </a-marker>

      <!-- ========================================== -->
      <!-- AGILE TASK CARDS / NOTES (Kanji Marker)    -->
      <!-- ========================================== -->
      <a-marker id="kanji-marker" preset="kanji" smooth="true" smoothCount="15" smoothTolerance="0.01" smoothThreshold="5">
        
        <a-entity scale="0.8 0.8 0.8" position="0 0 0.2">
          
          <!-- Note 1 (Subtle Pastel Yellow) -->
          <a-plane class="clickable" mark-done position="-1.4 0 0" rotation="0 0 2" width="1.2" height="1.2" color="#fef9e7">
            <a-plane width="1.2" height="1.2" color="#000000" material="opacity: 0.08" position="0.04 -0.04 -0.01"></a-plane>
            <!-- wrap-count="24" ensures crisp, small text inside the note -->
            <a-text id="note1-data" value="..." color="#2c3e50" align="center" position="0 0 0.02" width="2.2" wrap-count="24" font="roboto"></a-text>
          </a-plane>

          <!-- Note 2 (Subtle Pastel Rose) -->
          <a-plane class="clickable" mark-done position="0 0 0" rotation="0 0 -1.5" width="1.2" height="1.2" color="#fdedec">
            <a-plane width="1.2" height="1.2" color="#000000" material="opacity: 0.08" position="0.04 -0.04 -0.01"></a-plane>
            <a-text id="note2-data" value="..." color="#2c3e50" align="center" position="0 0 0.02" width="2.2" wrap-count="24" font="roboto"></a-text>
          </a-plane>

          <!-- Note 3 (Subtle Pastel Cyan/Blue) -->
          <a-plane class="clickable" mark-done position="1.4 0 0" rotation="0 0 1" width="1.2" height="1.2" color="#ebf5fb">
            <a-plane width="1.2" height="1.2" color="#000000" material="opacity: 0.08" position="0.04 -0.04 -0.01"></a-plane>
            <a-text id="note3-data" value="..." color="#2c3e50" align="center" position="0 0 0.02" width="2.2" wrap-count="24" font="roboto"></a-text>
          </a-plane>

        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>

  </body>
</html>
