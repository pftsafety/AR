<!DOCTYPE html>
<html>
  <head>
    <title>Streamlined AR Office HUD</title>
    
    <!-- PWA Manifest & Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#00ffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      #install-btn {
        display: none;
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 9999;
        background-color: #00ffff;
        color: #000;
        font-family: Arial, sans-serif;
        font-weight: bold;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 255, 255, 0.4);
        cursor: pointer;
      }
    </style>

    <script>
      // ==========================================
      // PWA INSTALLATION LOGIC
      // ==========================================
      let deferredPrompt;
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js');
        });
      }
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('install-btn').style.display = 'block';
      });
      function installApp() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              document.getElementById('install-btn').style.display = 'none';
            }
            deferredPrompt = null;
          });
        }
      }

      // ==========================================
      // YOUR GOOGLE APPS SCRIPT URL
      // ==========================================
      const scriptURL = 'https://script.google.com/macros/s/AKfycbzEpfF8pJVOPFhJF0DJIIojictD5N9KpmmRjx7tN_0AphPqMyLhAvNxfX62zQFsygup2g/exec';

      // ==========================================
      // FETCH DATA ON LOAD
      // ==========================================
      window.onload = function() {
        fetch(scriptURL)
          .then(response => response.json())
          .then(data => {
            document.querySelector('#whiteboard-text').setAttribute('value', data.Whiteboard || "");
            document.querySelector('#note1-text').setAttribute('value', data.Note1 || "");
            document.querySelector('#note2-text').setAttribute('value', data.Note2 || "");
            document.querySelector('#note3-text').setAttribute('value', data.Note3 || "");
          })
          .catch(error => console.error("Error fetching data:", error));
          
        // Audio Feedback
        const hiroMarker = document.querySelector('#hiro-marker');
        const kanjiMarker = document.querySelector('#kanji-marker');
        const scanSound = document.querySelector('#scan-sound');

        hiroMarker.addEventListener('markerFound', function() {
          scanSound.components.sound.playSound();
        });
        kanjiMarker.addEventListener('markerFound', function() {
          scanSound.components.sound.playSound();
        });
      };

      // ==========================================
      // INTERACTIVE COMPONENT
      // ==========================================
      AFRAME.registerComponent('mark-done', {
        init: function () {
          let isDone = false;
          let originalColor = this.el.getAttribute('color');
          this.el.addEventListener('click', function () {
            if (!isDone) {
              this.setAttribute('color', '#00ff00');
              this.querySelector('a-text').setAttribute('value', 'COMPLETED');
              this.querySelector('a-text').setAttribute('color', '#00ff00');
              isDone = true;
            } else {
              this.setAttribute('color', originalColor);
              this.querySelector('a-text').setAttribute('value', 'Resetting...'); 
              isDone = false;
            }
          });
        }
      });
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    
    <button id="install-btn" onclick="installApp()">⬇ Install AR App</button>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3; sourceWidth:1280; sourceHeight:960; displayWidth: 1280; displayHeight: 960;" cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable">
      
      <a-assets>
        <audio id="chime" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=success-1-6297.mp3" preload="auto"></audio>
      </a-assets>
      <a-entity id="scan-sound" sound="src: #chime; volume: 1"></a-entity>

      <!-- ========================================== -->
      <!-- FRONT WALL: Hiro Marker (Whiteboard)       -->
      <!-- ========================================== -->
      <a-marker id="hiro-marker" preset="hiro" smooth="true" smoothCount="20" smoothTolerance="0.05" smoothThreshold="10">
        <!-- Scaled down to 50% (scale="0.5 0.5 0.5") so it fits nicely on a phone screen without backing up -->
        <a-entity scale="0.5 0.5 0.5" position="0 0.5 0">
          <a-plane position="0 0 0" rotation="-90 0 0" width="4.2" height="2.2" color="#00ffff" material="opacity: 0.1; transparent: true"></a-plane>
          <a-plane position="0 0.01 0" rotation="-90 0 0" width="4" height="2" color="#111111" material="opacity: 0.8; transparent: true">
            <a-text value="MAIN TERMINAL" color="#00ffff" position="-1.8 0.8 0" width="4" font="exo2bold"></a-text>
            <a-text id="whiteboard-text" value="Loading network data..." color="#ffffff" position="-1.8 0.3 0" width="3" line-height="50"></a-text>
          </a-plane>
        </a-entity>
      </a-marker>

      <!-- ========================================== -->
      <!-- LEFT WALL: Kanji Marker (Sticky Notes)     -->
      <!-- ========================================== -->
      <a-marker id="kanji-marker" preset="kanji" smooth="true" smoothCount="20" smoothTolerance="0.05" smoothThreshold="10">
        <!-- Scaled down to 60% and lifted slightly -->
        <a-entity scale="0.6 0.6 0.6" position="0 0.5 0">
          
          <!-- Note 1 (Yellow) -->
          <a-plane position="-1.4 0 0" rotation="-90 0 0" width="1.2" height="1.2" color="#ffff00" material="opacity: 0.2; transparent: true"></a-plane>
          <a-plane class="clickable" mark-done position="-1.4 0.01 0" rotation="-90 0 0" width="1.1" height="1.1" color="#222222" material="opacity: 0.9">
            <a-text id="note1-text" value="..." color="#ffff00" align="center" position="0 0.1 0" width="3"></a-text>
          </a-plane>

          <!-- Note 2 (Pink) -->
          <a-plane position="0 0 0" rotation="-90 0 0" width="1.2" height="1.2" color="#ff00ff" material="opacity: 0.2; transparent: true"></a-plane>
          <a-plane class="clickable" mark-done position="0 0.01 0" rotation="-90 0 0" width="1.1" height="1.1" color="#222222" material="opacity: 0.9">
            <a-text id="note2-text" value="..." color="#ff00ff" align="center" position="0 0.1 0" width="3"></a-text>
          </a-plane>

          <!-- Note 3 (Cyan) -->
          <a-plane position="1.4 0 0" rotation="-90 0 0" width="1.2" height="1.2" color="#00ffff" material="opacity: 0.2; transparent: true"></a-plane>
          <a-plane class="clickable" mark-done position="1.4 0.01 0" rotation="-90 0 0" width="1.1" height="1.1" color="#222222" material="opacity: 0.9">
            <a-text id="note3-text" value="..." color="#00ffff" align="center" position="0 0.1 0" width="3"></a-text>
          </a-plane>

        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
