<!DOCTYPE html>
<html>
  <head>
    <title>Instant AR Office HUD</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#00ffff">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <style>
      #install-btn {
        display: none;
        position: absolute;
        top: 20px;
        right: 20px;
        z-index: 9999;
        background-color: #00ffff;
        color: #000;
        font-family: Arial, sans-serif;
        font-weight: bold;
        border: none;
        padding: 12px 24px;
        border-radius: 8px;
        box-shadow: 0 4px 10px rgba(0, 255, 255, 0.4);
        cursor: pointer;
      }
    </style>

    <script>
      // ==========================================
      // PWA INSTALLATION
      // ==========================================
      let deferredPrompt;
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js'); });
      }
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        document.getElementById('install-btn').style.display = 'block';
      });
      function installApp() {
        if (deferredPrompt) {
          deferredPrompt.prompt();
          deferredPrompt.userChoice.then((choiceResult) => {
            if (choiceResult.outcome === 'accepted') {
              document.getElementById('install-btn').style.display = 'none';
            }
            deferredPrompt = null;
          });
        }
      }

      // ==========================================
      // YOUR GOOGLE APPS SCRIPT URL
      // ==========================================
      const scriptURL = 'https://script.google.com/macros/s/AKfycbzEpfF8pJVOPFhJF0DJIIojictD5N9KpmmRjx7tN_0AphPqMyLhAvNxfX62zQFsygup2g/exec';

      // ==========================================
      // INSTANT SCAN LOGIC
      // ==========================================
      let isHUDLocked = false; 

      window.onload = function() {
        fetch(scriptURL)
          .then(response => response.json())
          .then(data => {
            document.querySelector('#board-data').setAttribute('value', data.Whiteboard || "No Data");
            document.querySelector('#note1-data').setAttribute('value', data.Note1 || "...");
            document.querySelector('#note2-data').setAttribute('value', data.Note2 || "...");
            document.querySelector('#note3-data').setAttribute('value', data.Note3 || "...");
          })
          .catch(error => console.error("Error fetching data:", error));

        const hiroMarker = document.querySelector('#hiro-marker');
        const kanjiMarker = document.querySelector('#kanji-marker');
        const whiteboardUI = document.querySelector('#ui-whiteboard');
        const stickyUI = document.querySelector('#ui-stickies');
        const scanSound = document.querySelector('#scan-sound');

        hiroMarker.addEventListener('markerFound', function() {
          if (isHUDLocked) return; 
          isHUDLocked = true;
          scanSound.components.sound.playSound(); 
          whiteboardUI.setAttribute('visible', 'true');
          stickyUI.setAttribute('visible', 'false');
          whiteboardUI.emit('pop-in');
        });

        kanjiMarker.addEventListener('markerFound', function() {
          if (isHUDLocked) return; 
          isHUDLocked = true;
          scanSound.components.sound.playSound(); 
          stickyUI.setAttribute('visible', 'true');
          whiteboardUI.setAttribute('visible', 'false');
          stickyUI.emit('pop-in');
        });
      };

      // ==========================================
      // INTERACTIVE COMPONENTS
      // ==========================================
      AFRAME.registerComponent('close-hud', {
        init: function () {
          this.el.addEventListener('click', () => {
            document.querySelector('#ui-whiteboard').setAttribute('visible', 'false');
            document.querySelector('#ui-stickies').setAttribute('visible', 'false');
            setTimeout(() => { isHUDLocked = false; }, 1500);
          });
        }
      });

      AFRAME.registerComponent('mark-done', {
        init: function () {
          let isDone = false;
          let originalColor = this.el.getAttribute('color');
          this.el.addEventListener('click', function () {
            if (!isDone) {
              this.setAttribute('color', '#00ff00');
              this.querySelector('a-text').setAttribute('value', 'COMPLETED');
              this.querySelector('a-text').setAttribute('color', '#00ff00');
              isDone = true;
            } else {
              this.setAttribute('color', originalColor);
              this.querySelector('a-text').setAttribute('value', 'Reset'); 
              isDone = false;
            }
          });
        }
      });
    </script>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    
    <button id="install-btn" onclick="installApp()">⬇ Install AR App</button>

    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;" cursor="rayOrigin: mouse; fuse: false" raycaster="objects: .clickable">
      
      <a-assets>
        <audio id="chime" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=success-1-6297.mp3" preload="auto"></audio>
      </a-assets>
      <a-entity id="scan-sound" sound="src: #chime; volume: 1"></a-entity>

      <!-- PHYSICAL MARKERS -->
      <a-marker id="hiro-marker" preset="hiro"></a-marker>
      <a-marker id="kanji-marker" preset="kanji"></a-marker>

      <a-entity camera look-controls>
        <!-- Pushed back to Z: -6 so the larger board fits perfectly on a vertical phone screen -->
        <a-entity id="hud-container" position="0 0 -6">
          
          <!-- ========================================== -->
          <!-- WHITEBOARD UI                              -->
          <!-- ========================================== -->
          <a-entity id="ui-whiteboard" visible="false" animation="property: scale; from: 0 0 0; to: 1 1 1; dur: 300; easing: easeOutQuad; startEvents: pop-in">
            
            <!-- Taller Board (Height: 3.5) -->
            <a-plane position="0 0.5 0" width="4.2" height="3.5" color="#111111" material="opacity: 0.95" border="color: #00ffff; width: 0.02">
              
              <!-- Anchored Top-Left so text flows naturally downward -->
              <a-text value="MAIN TERMINAL" color="#00ffff" position="-1.9 1.4 0" width="4" font="exo2bold" anchor="left" baseline="top"></a-text>
              
              <!-- wrap-count="35" forces line breaks so data never leaves the board -->
              <a-text id="board-data" value="Loading data..." color="#ffffff" position="-1.9 1.0 0" width="3.8" wrap-count="35" anchor="left" baseline="top" line-height="50"></a-text>
            </a-plane>

            <!-- Close Button -->
            <a-plane class="clickable" close-hud position="0 -1.8 0.01" width="2" height="0.6" color="#ff0000" material="opacity: 0.8">
              <a-text value="CLOSE" color="#ffffff" align="center" position="0 0 0.02" width="3" font="exo2bold"></a-text>
            </a-plane>
          </a-entity>

          <!-- ========================================== -->
          <!-- STICKY NOTES UI                            -->
          <!-- ========================================== -->
          <a-entity id="ui-stickies" visible="false" animation="property: scale; from: 0 0 0; to: 1 1 1; dur: 300; easing: easeOutQuad; startEvents: pop-in">
            
            <!-- Sticky Note 1 (Added wrap-count="15" for better text fitting) -->
            <a-plane class="clickable" mark-done position="-1.4 0.5 0" width="1.2" height="1.2" color="#ffff00" material="opacity: 0.95">
              <a-text id="note1-data" value="..." color="#000000" align="center" position="0 0 0.02" width="2.5" wrap-count="15"></a-text>
            </a-plane>
            
            <!-- Sticky Note 2 -->
            <a-plane class="clickable" mark-done position="0 0.5 0" width="1.2" height="1.2" color="#ff00ff" material="opacity: 0.95">
              <a-text id="note2-data" value="..." color="#000000" align="center" position="0 0 0.02" width="2.5" wrap-count="15"></a-text>
            </a-plane>
            
            <!-- Sticky Note 3 -->
            <a-plane class="clickable" mark-done position="1.4 0.5 0" width="1.2" height="1.2" color="#00ffff" material="opacity: 0.95">
              <a-text id="note3-data" value="..." color="#000000" align="center" position="0 0 0.02" width="2.5" wrap-count="15"></a-text>
            </a-plane>

            <!-- Close Button -->
            <a-plane class="clickable" close-hud position="0 -0.6 0.01" width="2" height="0.6" color="#ff0000" material="opacity: 0.8">
              <a-text value="CLOSE" color="#ffffff" align="center" position="0 0 0.02" width="3" font="exo2bold"></a-text>
            </a-plane>
          </a-entity>

        </a-entity>
      </a-entity>
      
    </a-scene>
  </body>
</html>
