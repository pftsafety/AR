<!DOCTYPE html>
<html>
<head>
  <title>Professional AR Workspace</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <!-- AR.js -->
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

  <style>

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #000;
    }

    /* =========================================================
       MOBILE AR HUD
       ========================================================= */

    #ar-hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 9999;
      pointer-events: none;
    }

    .hud-top {
      margin: 14px;
      padding: 12px 16px;
      border-radius: 16px;

      background: rgba(15, 23, 42, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      color: white;

      display: flex;
      justify-content: space-between;
      align-items: center;

      box-shadow:
        0 8px 30px rgba(0,0,0,0.25);

      border: 1px solid rgba(255,255,255,0.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;

      display: flex;
      align-items: center;
      justify-content: center;

      background: linear-gradient(135deg, #2563eb, #06b6d4);

      font-size: 17px;
      font-weight: bold;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .brand-subtitle {
      font-size: 10px;
      opacity: 0.65;
      margin-top: 2px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;

      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.5px;

      color: #86efac;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #22c55e;

      box-shadow: 0 0 10px #22c55e;
    }

    /* =========================================================
       SCAN INSTRUCTION
       ========================================================= */

    #scan-message {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);

      z-index: 9999;

      width: calc(100% - 40px);
      max-width: 420px;

      padding: 13px 18px;

      text-align: center;

      border-radius: 14px;

      color: white;
      font-size: 12px;
      font-weight: 600;

      background: rgba(15, 23, 42, 0.86);

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);

      border: 1px solid rgba(255,255,255,0.12);

      box-shadow: 0 10px 35px rgba(0,0,0,0.3);

      transition: all 0.3s ease;
    }

    #scan-message.active {
      background: rgba(22, 101, 52, 0.88);
    }

    /* =========================================================
       LOADING
       ========================================================= */

    #loading {
      position: fixed;
      inset: 0;

      z-index: 10000;

      display: flex;
      flex-direction: column;

      align-items: center;
      justify-content: center;

      background: #0f172a;

      color: white;
    }

    .loader {
      width: 42px;
      height: 42px;

      border: 3px solid rgba(255,255,255,0.15);
      border-top-color: #38bdf8;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

      margin-bottom: 16px;
    }

    .loading-title {
      font-size: 15px;
      font-weight: 700;
    }

    .loading-subtitle {
      margin-top: 6px;
      font-size: 11px;
      opacity: 0.55;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

  </style>

  <script>

    /* =========================================================
       SERVICE WORKER
       ========================================================= */

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker
          .register('./sw.js')
          .catch(err => console.warn("Service Worker:", err));
      });
    }

    /* =========================================================
       GOOGLE APPS SCRIPT
       ========================================================= */

    const scriptURL =
      'https://script.google.com/macros/s/AKfycbzEpfF8pJVOPFhJF0DJIIojictD5N9KpmmRjx7tN_0AphPqMyLhAvNxfX62zQFsygup2g/exec';


    /* =========================================================
       MARK-DONE COMPONENT
       ========================================================= */

    AFRAME.registerComponent('mark-done', {

      init: function () {

        let isDone = false;

        const originalColor =
          this.el.getAttribute('color');

        const text =
          this.el.querySelector('.note-text');

        const badge =
          this.el.querySelector('.note-status');

        this.el.addEventListener('click', () => {

          if (!isDone) {

            this.el.setAttribute(
              'color',
              '#dcfce7'
            );

            if (text) {
              text.setAttribute(
                'color',
                '#166534'
              );
            }

            if (badge) {
              badge.setAttribute(
                'value',
                '✓ COMPLETED'
              );

              badge.setAttribute(
                'color',
                '#15803d'
              );
            }

            isDone = true;

          } else {

            this.el.setAttribute(
              'color',
              originalColor
            );

            if (text) {
              text.setAttribute(
                'color',
                '#1e293b'
              );
            }

            if (badge) {
              badge.setAttribute(
                'value',
                'OPEN'
              );

              badge.setAttribute(
                'color',
                '#64748b'
              );
            }

            isDone = false;
          }

        });

      }

    });


    /* =========================================================
       DATA LOADING
       ========================================================= */

    window.addEventListener('load', () => {

      const loading =
        document.getElementById('loading');

      const scanMessage =
        document.getElementById('scan-message');

      fetch(scriptURL)

        .then(response => {

          if (!response.ok) {
            throw new Error(
              'Unable to connect to data source'
            );
          }

          return response.json();

        })

        .then(data => {

          /* Whiteboard */

          document
            .querySelector('#board-data')
            .setAttribute(
              'value',
              data.Whiteboard ||
              'No active project updates.'
            );


          /* Notes */

          document
            .querySelector('#note1-data')
            .setAttribute(
              'value',
              data.Note1 || 'No task available'
            );

          document
            .querySelector('#note2-data')
            .setAttribute(
              'value',
              data.Note2 || 'No task available'
            );

          document
            .querySelector('#note3-data')
            .setAttribute(
              'value',
              data.Note3 || 'No task available'
            );


          /* Hide loader */

          setTimeout(() => {

            loading.style.opacity = '0';

            setTimeout(() => {
              loading.style.display = 'none';
            }, 300);

          }, 400);


          /* Scan message */

          scanMessage.innerText =
            'SCAN A MARKER TO VIEW PROJECT INFORMATION';


          /* Marker audio */

          const hiroMarker =
            document.querySelector('#hiro-marker');

          const kanjiMarker =
            document.querySelector('#kanji-marker');

          const scanSound =
            document.querySelector('#scan-sound');


          const playSound = () => {

            try {

              if (
                scanSound &&
                scanSound.components &&
                scanSound.components.sound
              ) {
                scanSound
                  .components
                  .sound
                  .playSound();
              }

            } catch (e) {
              console.warn(
                'Audio playback blocked'
              );
            }

          };


          hiroMarker.addEventListener(
            'markerFound',
            () => {

              playSound();

              scanMessage.innerText =
                '✓ EXECUTIVE SUMMARY DETECTED';

              scanMessage.classList.add(
                'active'
              );

            }
          );


          hiroMarker.addEventListener(
            'markerLost',
            () => {

              scanMessage.innerText =
                'SCAN A MARKER TO VIEW PROJECT INFORMATION';

              scanMessage.classList.remove(
                'active'
              );

            }
          );


          kanjiMarker.addEventListener(
            'markerFound',
            () => {

              playSound();

              scanMessage.innerText =
                '✓ TASK BOARD DETECTED';

              scanMessage.classList.add(
                'active'
              );

            }
          );


          kanjiMarker.addEventListener(
            'markerLost',
            () => {

              scanMessage.innerText =
                'SCAN A MARKER TO VIEW PROJECT INFORMATION';

              scanMessage.classList.remove(
                'active'
              );

            }
          );

        })

        .catch(error => {

          console.error(
            'Error loading data:',
            error
          );

          loading.innerHTML = `
            <div style="
              font-size:38px;
              margin-bottom:16px;
            ">⚠</div>

            <div class="loading-title">
              Unable to Load Data
            </div>

            <div class="loading-subtitle">
              Please check your internet connection
            </div>
          `;

        });

    });

  </script>

</head>


<body>


  <!-- =========================================================
       LOADING SCREEN
       ========================================================= -->

  <div id="loading">

    <div class="loader"></div>

    <div class="loading-title">
      Initializing AR Workspace
    </div>

    <div class="loading-subtitle">
      Connecting to project data...
    </div>

  </div>


  <!-- =========================================================
       AR HUD
       ========================================================= -->

  <div id="ar-hud">

    <div class="hud-top">

      <div class="brand">

        <div class="brand-icon">
          AR
        </div>

        <div>

          <div class="brand-title">
            PROJECT AR WORKSPACE
          </div>

          <div class="brand-subtitle">
            REAL-TIME PROJECT VISUALIZATION
          </div>

        </div>

      </div>


      <div class="status">

        <span class="status-dot"></span>

        ONLINE

      </div>

    </div>

  </div>


  <!-- =========================================================
       SCAN MESSAGE
       ========================================================= -->

  <div id="scan-message">
    INITIALIZING CAMERA...
  </div>


  <!-- =========================================================
       AR SCENE
       ========================================================= -->

  <a-scene

    embedded

    arjs="
      sourceType: webcam;
      debugUIEnabled: false;
      sourceWidth: 640;
      sourceHeight: 480;
      displayWidth: 640;
      displayHeight: 480;
    "

    cursor="
      rayOrigin: mouse;
      fuse: false;
    "

    raycaster="
      objects: .clickable;
    "

    vr-mode-ui="
      enabled: false;
    ">


    <!-- =====================================================
         ASSETS
         ===================================================== -->

    <a-assets>

      <audio
        id="chime"
        src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3?filename=success-1-6297.mp3"
        preload="auto">
      </audio>

    </a-assets>


    <a-entity
      id="scan-sound"
      sound="
        src: #chime;
        volume: 0.7;
      ">
    </a-entity>


    <!-- =====================================================
         EXECUTIVE SUMMARY
         HIRO MARKER
         ===================================================== -->

    <a-marker

      id="hiro-marker"

      preset="hiro"

      smooth="true"

      smoothCount="15"

      smoothTolerance="0.01"

      smoothThreshold="5">


      <a-entity
        scale="0.68 0.68 0.68"
        position="0 0 0.2">


        <!-- OUTER SHADOW -->

        <a-plane

          width="4.35"

          height="3.35"

          color="#000000"

          material="
            opacity:0.25;
            transparent:true;
          "

          position="
            0.08
            -0.08
            -0.02
          ">

        </a-plane>


        <!-- EXECUTIVE FRAME -->

        <a-plane

          width="4.3"

          height="3.3"

          color="#0f172a"

          position="0 0 0">

        </a-plane>


        <!-- WHITE BOARD -->

        <a-plane

          width="4.08"

          height="3.08"

          color="#ffffff"

          position="0 0 0.02">


          <!-- TOP HEADER -->

          <a-plane

            width="4.08"

            height="0.55"

            color="#f8fafc"

            position="
              0
              1.265
              0.01">

          </a-plane>


          <!-- BLUE ACCENT -->

          <a-plane

            width="4.08"

            height="0.035"

            color="#2563eb"

            position="
              0
              0.985
              0.015">

          </a-plane>


          <!-- TITLE -->

          <a-text

            value="PROJECT EXECUTIVE SUMMARY"

            color="#0f172a"

            position="
              -1.78
              1.20
              0.02"

            width="3.4"

            font="roboto"

            fontWeight="bold">

          </a-text>


          <!-- STATUS -->

          <a-text

            value="LIVE PROJECT STATUS"

            color="#2563eb"

            position="
              -1.78
              1.02
              0.02"

            width="2.5"

            font="roboto"

            fontWeight="bold">

          </a-text>


          <!-- SUMMARY -->

          <a-text

            id="board-data"

            value="Loading project information..."

            color="#334155"

            position="
              -1.78
              0.82
              0.02"

            width="3.55"

            wrap-count="46"

            anchor="left"

            baseline="top"

            line-height="42"

            font="roboto">

          </a-text>


          <!-- FOOTER LINE -->

          <a-plane

            width="3.55"

            height="0.012"

            color="#e2e8f0"

            position="
              0
              -1.22
              0.02">

          </a-plane>


          <!-- FOOTER -->

          <a-text

            value="HLL • PROJECT MANAGEMENT"

            color="#94a3b8"

            position="
              -1.78
              -1.38
              0.02"

            width="2.5"

            font="roboto">

          </a-text>


        </a-plane>


      </a-entity>

    </a-marker>


    <!-- =====================================================
         TASK BOARD
         KANJI MARKER
         ===================================================== -->

    <a-marker

      id="kanji-marker"

      preset="kanji"

      smooth="true"

      smoothCount="15"

      smoothTolerance="0.01"

      smoothThreshold="5">


      <a-entity

        scale="0.82 0.82 0.82"

        position="0 0 0.2">


        <!-- BOARD TITLE -->

        <a-text

          value="ACTIVE TASK BOARD"

          color="#ffffff"

          position="
            0
            1.25
            0.04"

          align="center"

          width="4.2"

          font="roboto"

          fontWeight="bold">

        </a-text>


        <a-text

          value="TAP A TASK TO MARK IT COMPLETED"

          color="#cbd5e1"

          position="
            0
            1.02
            0.04"

          align="center"

          width="3.2"

          font="roboto">

        </a-text>


        <!-- =================================================
             NOTE 1
             ================================================= -->

        <a-entity
          position="-1.45 0 0">

          <!-- shadow -->

          <a-plane

            width="1.38"

            height="1.38"

            color="#000000"

            material="
              opacity:0.20;
              transparent:true;
            "

            position="
              0.06
              -0.06
              -0.02">

          </a-plane>


          <!-- card -->

          <a-plane

            class="clickable"

            mark-done

            width="1.35"

            height="1.35"

            color="#fef3c7"

            rotation="0 0 2">

            <!-- top bar -->

            <a-plane

              width="1.35"

              height="0.16"

              color="#f59e0b"

              position="
                0
                0.595
                0.01">

            </a-plane>


            <!-- task -->

            <a-text

              id="note1-data"

              class="note-text"

              value="Loading..."

              color="#1e293b"

              align="center"

              position="
                0
                0.02
                0.03"

              width="2.35"

              wrap-count="22"

              font="roboto"

              baseline="center">

            </a-text>


            <!-- status -->

            <a-text

              class="note-status"

              value="OPEN"

              color="#64748b"

              align="center"

              position="
                0
                -0.53
                0.03"

              width="1.3"

              font="roboto"

              fontWeight="bold">

            </a-text>


          </a-plane>

        </a-entity>


        <!-- =================================================
             NOTE 2
             ================================================= -->

        <a-entity
          position="0 0 0">

          <a-plane

            width="1.38"

            height="1.38"

            color="#000000"

            material="
              opacity:0.20;
              transparent:true;
            "

            position="
              0.06
              -0.06
              -0.02">

          </a-plane>


          <a-plane

            class="clickable"

            mark-done

            width="1.35"

            height="1.35"

            color="#fce7f3"

            rotation="0 0 -1.5">


            <a-plane

              width="1.35"

              height="0.16"

              color="#ec4899"

              position="
                0
                0.595
                0.01">

            </a-plane>


            <a-text

              id="note2-data"

              class="note-text"

              value="Loading..."

              color="#1e293b"

              align="center"

              position="
                0
                0.02
                0.03"

              width="2.35"

              wrap-count="22"

              font="roboto"

              baseline="center">

            </a-text>


            <a-text

              class="note-status"

              value="OPEN"

              color="#64748b"

              align="center"

              position="
                0
                -0.53
                0.03"

              width="1.3"

              font="roboto"

              fontWeight="bold">

            </a-text>


          </a-plane>

        </a-entity>


        <!-- =================================================
             NOTE 3
             ================================================= -->

        <a-entity
          position="1.45 0 0">


          <a-plane

            width="1.38"

            height="1.38"

            color="#000000"

            material="
              opacity:0.20;
              transparent:true;
            "

            position="
              0.06
              -0.06
              -0.02">

          </a-plane>


          <a-plane

            class="clickable"

            mark-done

            width="1.35"

            height="1.35"

            color="#e0f2fe"

            rotation="0 0 1">


            <a-plane

              width="1.35"

              height="0.16"

              color="#0284c7"

              position="
                0
                0.595
                0.01">

            </a-plane>


            <a-text

              id="note3-data"

              class="note-text"

              value="Loading..."

              color="#1e293b"

              align="center"

              position="
                0
                0.02
                0.03"

              width="2.35"

              wrap-count="22"

              font="roboto"

              baseline="center">

            </a-text>


            <a-text

              class="note-status"

              value="OPEN"

              color="#64748b"

              align="center"

              position="
                0
                -0.53
                0.03"

              width="1.3"

              font="roboto"

              fontWeight="bold">

            </a-text>


          </a-plane>

        </a-entity>


      </a-entity>

    </a-marker>


    <!-- CAMERA -->

    <a-entity camera></a-entity>

  </a-scene>

</body>
</html>
